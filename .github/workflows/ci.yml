name: PL Capital Portfolio Agent CI

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  test-and-evaluate:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Set up Python 3.11
      uses: actions/setup-python@v5
      with:
        python-version: "3.11"
        cache: 'pip'

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt

    - name: Initialize Relational Database
      run: |
        python database/db_manager.py

    - name: Run Pytest Test Suite (106 Tests)
      run: |
        python -m pytest tests/ -v

    - name: Run Ground Truth Benchmark Evaluator (10/10)
      run: |
        python main.py --eval

    - name: Run Expanded Regression Benchmark Suite (23/23)
      run: |
        python main.py --regression
